global:
  scrape_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "localhost:9093"

scrape_configs:
  - job_name: "amigos"
    static_configs:
      - targets: ["localhost"]

  - job_name: "node"
    static_configs:
      - targets: ["localhost:9100"]
